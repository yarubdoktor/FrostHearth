name: Build FrostHearth Profile Settings APK

on:
  workflow_dispatch:
  push:
    paths:
      - "FrostHearth_Profile_Settings_Nav_v2.zip"
      - ".github/workflows/build-frosthearth-apk.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"

      - name: Set up Godot and Android export templates
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.4.1
          use-dotnet: false
          install-android-export-templates: true

      - name: Extract FrostHearth v2 project
        shell: bash
        run: |
          set -euo pipefail
          test -f "FrostHearth_Profile_Settings_Nav_v2.zip" || {
            echo "::error::FrostHearth_Profile_Settings_Nav_v2.zip is missing."
            exit 1
          }
          mkdir -p source
          unzip -q "FrostHearth_Profile_Settings_Nav_v2.zip" -d source
          PROJECT_FILE="$(find "$GITHUB_WORKSPACE/source" -type f -name project.godot -print -quit)"
          test -n "$PROJECT_FILE" || {
            echo "::error::Could not find project.godot in the ZIP."
            exit 1
          }
          echo "PROJECT_DIR=$(dirname "$PROJECT_FILE")" >> "$GITHUB_ENV"
          echo "Found Godot project: $PROJECT_FILE"

      - name: Configure Android export preset
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$PROJECT_DIR/build"
          if [ ! -f "$PROJECT_DIR/export_presets.cfg" ]; then
            cat > "$PROJECT_DIR/export_presets.cfg" <<'EOF'
          [preset.0]
          name="Android"
          platform="Android"
          runnable=true
          dedicated_server=false
          custom_features=""
          export_filter="all_resources"
          include_filter=""
          exclude_filter=""
          export_path="build/FrostHearth.apk"
          encryption_include_filters=""
          encryption_exclude_filters=""
          encrypt_pck=false
          encrypt_directory=false

          [preset.0.options]
          custom_template/debug=""
          custom_template/release=""
          gradle_build/use_gradle_build=false
          gradle_build/export_format=0
          gradle_build/min_sdk="23"
          gradle_build/target_sdk="35"
          architectures/armeabi-v7a=false
          architectures/arm64-v8a=true
          architectures/x86=false
          architectures/x86_64=false
          version/code=1
          version/name="2.0"
          package/unique_name="com.frosthearth.game"
          package/name="FrostHearth"
          package/signed=true
          permissions/internet=true
          EOF
          fi

      - name: Import project resources
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --editor --path "$PROJECT_DIR" --quit

      - name: Export Android APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          godot --headless --path . --export-debug "Android" build/FrostHearth.apk
          test -s build/FrostHearth.apk || {
            echo "::error::Godot export finished without producing the APK."
            exit 1
          }
          mkdir -p "$GITHUB_WORKSPACE/apk-output"
          cp build/FrostHearth.apk "$GITHUB_WORKSPACE/apk-output/FrostHearth-Profile-Settings-v2.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FrostHearth-Profile-Settings-v2-APK
          path: apk-output/FrostHearth-Profile-Settings-v2.apk
          if-no-files-found: error
          retention-days: 14
